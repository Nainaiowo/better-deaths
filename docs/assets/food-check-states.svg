      <stop offset="0" stop-color="#20232a"/>
      <stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <linearGradient id="active" x2="1" y2="0">
      <stop stop-color="#4fd1bb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4fd1bb" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="warning" x2="1" y2="0">
      <stop stop-color="#e8a847" stop-opacity=".30"/>
      <stop offset="1" stop-color="#e8a847" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="missing" x2="1" y2="0">
      <stop stop-color="#df6266" stop-opacity=".30"/>
      <stop offset="1" stop-color="#df6266" stop-opacity=".03"/>
    </linearGradient>
  </defs>
