<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="670" viewBox="0 0 1120 670" role="img" aria-labelledby="title desc">
  <title id="title">Better Deaths Food Check preview</title>
  <desc id="desc">Food Check settings and a party-list preview showing active, expiring, missing, and unavailable food status.</desc>
  <defs>
    <linearGradient id="shell" x2="0" y2="1">
      <stop offset="0" stop-color="#20232a"/>
      <stop offset="1" stop-color="#17191e"/>
    </linearGradient>
    <linearGradient id="active" x2="1" y2="0">
      <stop stop-color="#4fd1bb" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4fd1bb" stop-opacity=".025"/>
    </linearGradient>
    <linearGradient id="warning" x2="1" y2="0">
      <stop stop-color="#e8a847" stop-opacity=".30"/>
      <stop offset="1" stop-color="#e8a847" stop-opacity=".03"/>
    </linearGradient>
    <linearGradient id="missing" x2="1" y2="0">
      <stop stop-color="#df6266" stop-opacity=".30"/>
      <stop offset="1" stop-color="#df6266" stop-opacity=".03"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="670" fill="#101115"/>
  <rect x="20" y="20" width="1080" height="630" rx="9" fill="url(#shell)" stroke="#454954"/>
  <path d="M29 20h1062a9 9 0 0 1 9 9v4H20v-4a9 9 0 0 1 9-9" fill="#5cddb8"/>
  <text x="48" y="74" fill="#f3f2f0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="650">Food Check</text>
  <text x="48" y="101" fill="#aaaeb8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Party food status at a glance</text>
  <rect x="48" y="125" width="1024" height="1" fill="#343740"/>
  <rect x="48" y="148" width="22" height="22" rx="4" fill="#6de0bf"/>
  <path d="M54 159l4 4 8-9" fill="none" stroke="#15231f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="165" fill="#eeeff1" font-family="Segoe UI, Arial, sans-serif" font-size="17">Show Well Fed status</text>
  <rect x="48" y="192" width="434" height="45" rx="5" fill="#242730" stroke="#444854"/>
  <text x="65" y="220" fill="#e8e9ec" font-family="Segoe UI, Arial, sans-serif" font-size="15">Warn when under</text>
  <text x="443" y="220" text-anchor="end" fill="#f3f2f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">10 min</text>
  <rect x="48" y="245" width="434" height="5" rx="2.5" fill="#3c414d"/>
  <rect x="48" y="245" width="91" height="5" rx="2.5" fill="#6f5aa8"/>
  <circle cx="139" cy="247.5" r="8" fill="#d5c6fa" stroke="#352b50" stroke-width="2"/>
  <rect x="48" y="276" width="20" height="20" rx="4" fill="#262933" stroke="#6b6f7b"/>
  <text x="82" y="292" fill="#eeeff1" font-family="Segoe UI, Arial, sans-serif" font-size="16">Only show warnings</text>
  <text x="327" y="292" fill="#8e94a0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Hide healthy icons</text>
  <rect x="48" y="314" width="20" height="20" rx="4" fill="#6de0bf"/>
  <path d="M53 324l4 4 8-9" fill="none" stroke="#15231f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="82" y="330" fill="#eeeff1" font-family="Segoe UI, Arial, sans-serif" font-size="16">Tint party plates</text>
  <text x="243" y="330" fill="#8e94a0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Optional; off by default</text>
  <text x="48" y="363" fill="#e8e9ec" font-family="Segoe UI, Arial, sans-serif" font-size="14">Plate tint strength</text>
  <rect x="204" y="355" width="270" height="5" rx="2.5" fill="#3c414d"/>
  <rect x="204" y="355" width="150" height="5" rx="2.5" fill="#6f5aa8"/>
  <circle cx="354" cy="357.5" r="8" fill="#d5c6fa" stroke="#352b50" stroke-width="2"/>
  <text x="490" y="363" fill="#f3f2f0" font-family="Segoe UI, Arial, sans-serif" font-size="14">28%</text>
  <text x="48" y="394" fill="#8e94a0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Marker position and size follow Party Cooldowns layout.</text>
  <text x="48" y="423" fill="#d6c8ff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Party list preview</text>
  <text x="258" y="423" fill="#898e99" font-family="Segoe UI, Arial, sans-serif" font-size="13">Examples only; not live party data · 28% tint preview</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="48" y="443" width="1024" height="38" rx="4" fill="#20252b" stroke="#40504d"/>
    <rect x="49" y="444" width="1022" height="36" rx="3" fill="url(#active)"/>
    <rect x="58" y="450" width="25" height="25" rx="4" fill="#122d35" stroke="#55d5c0" stroke-width="1.5"/>
    <circle cx="70.5" cy="462.5" r="7" fill="#55d5c0" opacity=".9"/>
    <text x="97" y="468" fill="#f0f1f3" font-size="15" font-weight="600">A. D.</text>
    <rect x="151" y="469" width="89" height="4" rx="2" fill="#353a42"/>
    <rect x="151" y="469" width="74" height="4" rx="2" fill="#59bd7a"/>
    <text x="981" y="467" text-anchor="end" fill="#87e1cc" font-size="14">Well Fed · 42:18</text>
    <rect x="1017" y="450" width="25" height="25" rx="4" fill="#332b1d" stroke="#e8a847" stroke-width="1.5"/>
    <path d="M1023 462h13" stroke="#e8a847" stroke-width="2" stroke-linecap="round"/>

    <rect x="48" y="485" width="1024" height="38" rx="4" fill="#24272d" stroke="#574a35"/>
    <rect x="49" y="486" width="1022" height="36" rx="3" fill="url(#warning)"/>
    <rect x="58" y="492" width="25" height="25" rx="4" fill="#382c1c" stroke="#e8a847" stroke-width="1.5"/>
    <circle cx="70.5" cy="504.5" r="7" fill="none" stroke="#e8a847" stroke-width="2"/>
    <path d="M70.5 500v5l3 2" fill="none" stroke="#e8a847" stroke-width="1.5" stroke-linecap="round"/>
    <text x="97" y="510" fill="#f0f1f3" font-size="15" font-weight="600">M. C.</text>
    <rect x="151" y="511" width="89" height="4" rx="2" fill="#353a42"/>
    <rect x="151" y="511" width="74" height="4" rx="2" fill="#59bd7a"/>
    <text x="981" y="509" text-anchor="end" fill="#f0c16e" font-size="14">Refresh soon · 4:27</text>
    <rect x="1017" y="492" width="25" height="25" rx="4" fill="#382c1c" stroke="#e8a847" stroke-width="1.5"/>
    <circle cx="1029.5" cy="504.5" r="7" fill="none" stroke="#e8a847" stroke-width="2"/>
    <path d="M1029.5 500v5l3 2" fill="none" stroke="#e8a847" stroke-width="1.5" stroke-linecap="round"/>

    <rect x="48" y="527" width="1024" height="38" rx="4" fill="#29262a" stroke="#694044"/>
    <rect x="49" y="528" width="1022" height="36" rx="3" fill="url(#missing)"/>
    <rect x="58" y="534" width="25" height="25" rx="4" fill="#3b2328" stroke="#df6266" stroke-width="1.5"/>
    <circle cx="70.5" cy="546.5" r="7" fill="none" stroke="#df6266" stroke-width="2"/>
    <path d="M66 542l9 9m0-9-9 9" stroke="#df6266" stroke-width="1.5" stroke-linecap="round"/>
    <text x="97" y="552" fill="#f0f1f3" font-size="15" font-weight="600">R. T.</text>
    <rect x="151" y="553" width="89" height="4" rx="2" fill="#353a42"/>
    <rect x="151" y="553" width="74" height="4" rx="2" fill="#59bd7a"/>
    <text x="981" y="551" text-anchor="end" fill="#ee8587" font-size="14">No food detected</text>
    <rect x="1017" y="534" width="25" height="25" rx="4" fill="#3b2328" stroke="#df6266" stroke-width="1.5"/>
    <circle cx="1029.5" cy="546.5" r="7" fill="none" stroke="#df6266" stroke-width="2"/>
    <path d="M1025 542l9 9m0-9-9 9" stroke="#df6266" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="1038" cy="537" r="5.5" fill="#df6266"/>
    <text x="1038" y="540" text-anchor="middle" fill="#201719" font-size="8" font-weight="700">!</text>

    <rect x="48" y="569" width="1024" height="38" rx="4" fill="#202126" stroke="#343740"/>
    <rect x="58" y="576" width="25" height="25" rx="4" fill="#26282d" stroke="#69707a" stroke-width="1.3"/>
    <circle cx="70.5" cy="588.5" r="7" fill="none" stroke="#69707a" stroke-width="1.6"/>
    <text x="97" y="594" fill="#f0f1f3" font-size="15" font-weight="600">D. R.</text>
    <rect x="151" y="595" width="89" height="4" rx="2" fill="#353a42"/>
    <rect x="151" y="595" width="74" height="4" rx="2" fill="#59bd7a"/>
    <text x="1044" y="593" text-anchor="end" fill="#9ca1ac" font-size="14">Status unavailable</text>
  </g>
  <text x="48" y="636" fill="#8e94a0" font-family="Segoe UI, Arial, sans-serif" font-size="12">Healthy food remains calm. Amber and red states stand out. Unavailable data is never presented as missing food.</text>
</svg>
