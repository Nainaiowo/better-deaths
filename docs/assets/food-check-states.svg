<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="870" viewBox="0 0 1120 870" role="img" aria-labelledby="title desc">
  <title id="title">Better Deaths Food Check preview</title>
  <desc id="desc">Food Check settings for food icon size and position, plate tint controls, and a party-list preview showing active, expiring, missing, and unavailable food status.</desc>
  <defs>
